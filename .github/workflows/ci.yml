name: CI Pipeline

on:
  push:
    branches: [ main, develop, ai/audit-and-fixes ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install root dependencies
      run: npm ci

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint backend
      working-directory: ./backend
      run: npm run lint

    - name: Lint frontend
      working-directory: ./frontend
      run: npm run lint

    - name: Run backend unit tests
      working-directory: ./backend
      run: node --test tests/*.test.js
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://localhost:27017/denfit-test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-jwt-secret-key-for-ci
        SMTP_HOST: smtp.example.com
        SMTP_USER: test@example.com
        SMTP_PASS: testpass
        CLOUDINARY_API_SECRET: test-secret

    - name: Seed test database
      working-directory: ./backend
      run: npm run seed-admin
      env:
        MONGODB_URI: mongodb://localhost:27017/denfit-test
        JWT_SECRET: test-jwt-secret-key-for-ci
        ALLOW_DEV_BACKDOORS: "true"
        SEED_ADMIN_EMAIL: admin@denfit.com
        SEED_ADMIN_PASSWORD: TestAdmin123!

    - name: Start backend server
      working-directory: ./backend
      run: npm start &
      env:
        NODE_ENV: test
        PORT: 3002
        MONGODB_URI: mongodb://localhost:27017/denfit-test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-jwt-secret-key-for-ci
        ALLOWED_ORIGINS: http://localhost:3000
        ALLOW_DEV_BACKDOORS: "true"
        SKIP_CSRF: "true"
        SMTP_HOST: smtp.example.com
        SMTP_USER: test@example.com
        SMTP_PASS: testpass
        CLOUDINARY_API_SECRET: test-secret

    - name: Wait for backend
      run: npx wait-on http://localhost:3002/api/v1/health --timeout 60000

    - name: Run backend integration tests
      working-directory: ./backend
      run: npm run test:integration
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://localhost:27017/denfit-test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-jwt-secret-key-for-ci
        API_URL: http://localhost:3002

    - name: Run frontend unit tests
      working-directory: ./frontend
      run: npm run test:unit

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Run security audit
      run: |
        cd backend && npm audit --audit-level=high
        cd ../frontend && npm audit --audit-level=high

  e2e-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
      
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd backend && npm ci
        cd ../frontend && npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Seed test database
      working-directory: ./backend
      run: npm run seed-admin
      env:
        MONGODB_URI: mongodb://localhost:27017/denfit-test
        JWT_SECRET: test-jwt-secret-key-for-ci
        ALLOW_DEV_BACKDOORS: "true"
        SEED_ADMIN_EMAIL: admin@denfit.com
        SEED_ADMIN_PASSWORD: TestAdmin123!

    - name: Start backend server
      working-directory: ./backend
      run: npm start &
      env:
        NODE_ENV: test
        PORT: 3002
        MONGODB_URI: mongodb://localhost:27017/denfit-test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-jwt-secret-key-for-ci
        ALLOWED_ORIGINS: http://localhost:3000
        ALLOW_DEV_BACKDOORS: "true"
        SKIP_CSRF: "true"
        SMTP_HOST: smtp.example.com
        SMTP_USER: test@example.com
        SMTP_PASS: testpass
        CLOUDINARY_API_SECRET: test-secret

    - name: Wait for backend
      run: npx wait-on http://localhost:3002/api/v1/health --timeout 60000

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        CI: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: e2e-tests/test-report/
        retention-days: 30

    - name: Upload test videos
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-videos
        path: e2e-tests/test-results/
        retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true
